[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hy-asymmetric-link-research"
version = "0.3.0"
description = "Authorized research prototype for an asymmetric UDP transport"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hy-asym-link = "asym_link.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["asym_link*"]
